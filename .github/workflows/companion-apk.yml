name: Companion release APK

on:
  push:
    branches: [codex/observation-review]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-release
  cancel-in-progress: false

env:
  RELEASE_SIGNER_SHA256: f8ae5a2403c53b65fdf2ab471da67706bc58cfcb87cba3c9c04750ba15604c43
  LEGACY_SIGNER_SHA256: c3b8e9dcc82357158ba815dbf6d5c6c021a1008c5c32337bc01cf9b93af85930

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Require the legacy bootstrap signing key
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.COMPANION_LEGACY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$LEGACY_KEYSTORE_BASE64" ]; then
            echo "::error::COMPANION_LEGACY_KEYSTORE_BASE64 is required"
            exit 1
          fi
          umask 077
          printf '%s' "$LEGACY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/companion-legacy.keystore"
          test -s "$RUNNER_TEMP/companion-legacy.keystore"

      - name: Allocate the next serialized APK version code
        id: version_code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(python3 scripts/release/companion_release.py next-code --repo "$GITHUB_REPOSITORY" --floor 19)"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: app_version
        run: |
          version=$(node -p 'require("./package.json").version')
          printf 'name=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        run: python3 -m unittest scripts/release/test_companion_release.py
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build web bundle
        run: npm run build
        env:
          VITE_APP_BUILD: ${{ steps.version_code.outputs.code }}
      - run: npx cap sync android

      - name: Test, lint, and assemble committed-release-key APK
        working-directory: companion/android
        run: |
          set -euo pipefail
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon \
            -PcompanionVersionCode=${{ steps.version_code.outputs.code }} \
            -PcompanionVersionName=${{ steps.app_version.outputs.name }}
          mkdir -p ../release-out
          cp app/build/outputs/apk/release/app-release.apk ../release-out/companion.apk

      - name: Assemble legacy-key nondebuggable APK
        working-directory: companion/android
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon \
            -PcompanionVersionCode=${{ steps.version_code.outputs.code }} \
            -PcompanionVersionName=${{ steps.app_version.outputs.name }} \
            -PcompanionStoreFile="$RUNNER_TEMP/companion-legacy.keystore" \
            -PcompanionStorePassword=android \
            -PcompanionKeyAlias=androiddebugkey \
            -PcompanionKeyPassword=android
          cp app/build/outputs/apk/release/app-release.apk ../release-out/companion-legacy.apk

      - name: Verify both APK identities, versions, release mode, and signers
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 scripts/release/companion_release.py inspect \
            --apk release-out/companion.apk --aapt "$AAPT" --apksigner "$APKSIGNER" \
            --code "${{ steps.version_code.outputs.code }}" --version "${{ steps.app_version.outputs.name }}" \
            --cert "$RELEASE_SIGNER_SHA256" --asset-name companion.apk
          python3 scripts/release/companion_release.py inspect \
            --apk release-out/companion-legacy.apk --aapt "$AAPT" --apksigner "$APKSIGNER" \
            --code "${{ steps.version_code.outputs.code }}" --version "${{ steps.app_version.outputs.name }}" \
            --cert "$LEGACY_SIGNER_SHA256" --asset-name companion-legacy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: companion-build-${{ steps.version_code.outputs.code }}
          path: |
            companion/release-out/companion.apk
            companion/release-out/companion-legacy.apk
          if-no-files-found: error

      - name: Publish immutable release, verify it, then update latest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 scripts/release/companion_release.py publish \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --code "${{ steps.version_code.outputs.code }}" --version "${{ steps.app_version.outputs.name }}" \
            --release-apk release-out/companion.apk --legacy-apk release-out/companion-legacy.apk \
            --release-cert "$RELEASE_SIGNER_SHA256" --legacy-cert "$LEGACY_SIGNER_SHA256" \
            --aapt "$AAPT" --apksigner "$APKSIGNER"
